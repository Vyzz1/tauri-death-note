<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Death Note</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="stage">
      <div class="book" id="book">
        <div class="page">
          <div class="page-inner">
            <button class="close-tab" id="closeTab" title="Close (Esc)" aria-label="Close notebook">
              &times;
            </button>
            <textarea
              id="ruled"
              class="ruled"
              spellcheck="false"
              placeholder="Write here..."
            ></textarea>
            <div class="drag-handle" id="dragHandle" title="Drag left to close">
              <span class="drag-handle-grip"></span>
            </div>
          </div>
        </div>

        <div class="spine"></div>

        <div class="cover" id="cover" tabindex="0" role="button" aria-label="Open notebook">
          <div class="cover-face">
            <div class="cover-border"></div>
            <div class="cover-eye">
              <div class="cover-eye-iris"></div>
            </div>
            <h1 class="cover-title">DEATH<br />NOTE</h1>
            <p class="cover-hint">Click or press Enter to open</p>
            <p class="cover-shortcut">Ctrl+Shift+D — opens from anywhere</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
