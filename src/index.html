<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Death Note</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="stage">
      <div class="book" id="book">
        <div class="page">
          <div class="page-inner">
            <button class="close-tab" id="closeTab" title="Đóng sổ (Esc)" aria-label="Đóng sổ">
              &times;
            </button>
            <textarea
              id="ruled"
              class="ruled"
              spellcheck="false"
              placeholder="Viết vào đây..."
            ></textarea>
          </div>
        </div>

        <div class="spine"></div>

        <div class="cover" id="cover" tabindex="0" role="button" aria-label="Mở sổ tay">
          <div class="cover-face">
            <div class="cover-border"></div>
            <div class="cover-eye">
              <div class="cover-eye-iris"></div>
            </div>
            <h1 class="cover-title">DEATH<br />NOTE</h1>
            <p class="cover-hint">Nhấp hoặc nhấn Enter để mở</p>
            <p class="cover-shortcut">Ctrl+Shift+D — mở ở bất kỳ đâu</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
